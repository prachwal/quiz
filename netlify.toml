[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"
  # Build only on the dedicated `deploy` branch; skip builds for every other branch.
  # (Also set the production branch to `deploy` in the Netlify UI for production deploys.)
  ignore = "bash -c 'if [ \"$BRANCH\" != \"deploy\" ]; then exit 0; else exit 1; fi'"

# `netlify dev` starts Vite and proxies it, serving the API function (/api/*) on the same port
[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

# SPA fallback for client-side routes. /api/* needs no redirect: the function routes itself via
# `export const config = { path: '/api/*' }` in netlify/functions/api.mts, which takes precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
