[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# `netlify dev` starts Vite and proxies it, serving functions (e.g. /planets) on the same port
[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

# SPA fallback for client-side routes (must come after the /api rule)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
