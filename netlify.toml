[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# `netlify dev` starts Vite and proxies it, serving functions (e.g. /planets) on the same port
[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

# /api/* -> the Express app in netlify/functions/api.mts
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback for client-side routes (must come after the /api rule)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
